[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Serverless functions (the past-paper PDF proxy lives here).
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Explicit route for the proxy so the SPA fallback below never shadows it.
[[redirects]]
  from = "/api/pdf"
  to = "/.netlify/functions/pdf"
  status = 200

# Single-page app fallback.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-lived caching for hashed build assets.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
